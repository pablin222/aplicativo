name: CI
on:
  push:
    branches: [main, feat/universo-if-avalia-mvp]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run catalog:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
