<!doctype html><html lang="pt-BR"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:0;background:#f3f8fb;color:#18334c}main{max-width:760px;margin:auto;padding:20px}header{background:#075675;color:white;padding:22px}label{display:block;margin:15px 0;font-weight:600}select,input{width:100%;padding:12px;font:inherit;box-sizing:border-box;border:1px solid #889ca8;border-radius:8px}button{background:#076f80;color:white;border:0;border-radius:8px;padding:13px;font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid orange}section{background:white;padding:20px;border-radius:12px;margin:15px 0}.hidden{display:none}</style></head><body><header><h1>Universo IF Avalia</h1><p>Participação educativa — não oficial</p></header><main><button onclick="trocar('voto')">Avaliar</button> <button onclick="trocar('ranking')">Ranking</button><section id="voto"><label>Projeto<select id="projeto"></select></label><label>Código individual<input id="codigo" autocomplete="off" maxlength="128"/></label><div id="criterios"></div><p id="previa" aria-live="polite">Selecione as quatro notas.</p><button id="enviar" onclick="enviar()">Confirmar avaliação</button><p id="resposta" role="status"></p></section><section id="ranking" class="hidden"><label>Modalidade<select id="modalidade" onchange="mostrarRanking()"><option>Mostra Nacional</option><option>Mostra de Extensão</option></select></label><div id="lista" aria-live="polite"></div></section></main><script>
let projetos=[],rank=[],pendente=null;const labels=['Criatividade e inovação (30%)','Clareza da apresentação (30%)','Relevância e impacto (25%)','Demonstração e resultados (15%)'];const nomes=['Muito ruim','Ruim','Regular','Bom','Excelente'];const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function trocar(p){el('voto').classList.toggle('hidden',p!=='voto');el('ranking').classList.toggle('hidden',p!=='ranking');if(p==='ranking')atualizar();}function notas(){return labels.map((_,i)=>Number(el('n'+i).value));}function previa(){const n=notas();el('previa').textContent=n.every(x=>x>=1&&x<=5)?'Nota ponderada: '+(n[0]*.3+n[1]*.3+n[2]*.25+n[3]*.15).toFixed(2):'Selecione as quatro notas.';}labels.forEach((s,i)=>{const l=document.createElement('label');l.textContent=s;const select=document.createElement('select');select.id='n'+i;select.innerHTML='<option value="0">Selecione uma nota</option>'+nomes.map((x,j)=>'<option value="'+(j+1)+'">'+(j+1)+' — '+x+'</option>').join('');select.onchange=previa;l.appendChild(select);el('criterios').appendChild(l);});google.script.run.withSuccessHandler(p=>{projetos=p;el('projeto').innerHTML=p.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.titulo)+'</option>').join('');const id=new URLSearchParams(location.search).get('projeto');if(id&&p.some(x=>x.id===id))el('projeto').value=id;}).withFailureHandler(e=>el('resposta').textContent=e.message).listarProjetos();function enviar(){const n=notas(),codigo=el('codigo').value.trim(),id=el('projeto').value;if(n.some(x=>x<1)||!codigo){el('resposta').textContent='Preencha código e quatro notas.';return;}if(!pendente||pendente.codigo!==codigo||pendente.id_projeto!==id||JSON.stringify(pendente.notas)!==JSON.stringify(n))pendente={codigo,id_projeto:id,notas:n,id_requisicao:crypto.randomUUID().replace(/-/g,'')};el('enviar').disabled=true;el('resposta').textContent='Enviando e aguardando recibo…';google.script.run.withSuccessHandler(r=>{el('enviar').disabled=false;el('resposta').textContent=r.ok?'Avaliação registrada. Recibo: '+r.recibo.id_requisicao+' · Nota '+Number(r.recibo.nota).toFixed(2):'Não registrada: '+r.error;if(r.ok){pendente=null;el('codigo').value='';}}).withFailureHandler(e=>{el('enviar').disabled=false;el('resposta').textContent='Sem confirmação: '+e.message+'. Tente novamente para reutilizar a mesma requisição.';}).avaliar(pendente);}function atualizar(){el('lista').textContent='Carregando…';google.script.run.withSuccessHandler(r=>{rank=r.ranking;mostrarRanking()}).withFailureHandler(e=>el('lista').textContent=e.message).obterRanking();}function mostrarRanking(){const m=el('modalidade').value;el('lista').innerHTML=rank.filter(x=>x.modalidade===m).sort((a,b)=>(a.posicao||999)-(b.posicao||999)||a.id_projeto.localeCompare(b.id_projeto)).map(x=>'<p><strong>'+esc(x.posicao?x.posicao+'º':'Aguardando amostra mínima')+'</strong> · '+esc(x.titulo)+' · '+(x.posicao?x.media.toFixed(2):'—')+' · '+x.quantidade+' avaliações</p>').join('');}</script></body></html>
